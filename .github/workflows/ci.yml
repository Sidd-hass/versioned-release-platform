name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # 3. Install backend dependencies
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 5. Build frontend
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build backend Docker image
      - name: Build backend image
        run: |
          docker build \
            -t sidd24/versioning:backend-ci \
            ./backend

      # 8. Build frontend Docker image
      - name: Build frontend image
        run: |
          docker build \
            -t sidd24/versioning:frontend-ci \
            ./frontend

      # 9. Push backend image
      - name: Push backend image
        run: |
          docker push sidd24/versioning:backend-ci

      # 10. Push frontend image
      - name: Push frontend image
        run: |
          docker push sidd24/versioning:frontend-ci