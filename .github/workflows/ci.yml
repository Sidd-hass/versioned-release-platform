name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Build backend release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build \
            --build-arg APP_VERSION=$VERSION \
            -t sidd24/versioning:backend-$VERSION \
            ./backend

      - name: Build frontend release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker build \
            -t sidd24/versioning:frontend-$VERSION \
            ./frontend

      - name: Push backend release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push sidd24/versioning:backend-$VERSION

      - name: Push frontend release image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker push sidd24/versioning:frontend-$VERSION